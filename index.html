  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Helvetica, Arial, sans-serif;
    }

    .slideshow {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;

      /* Both images remain visible during the transition */
      opacity: 0;
      transition: opacity 2s ease-in-out;

      /* Prevent images from being clickable */
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 20px ;
      color: white;

      /* Keeps the text readable without overpowering the image */
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.9),
        rgba(0, 0, 0, 0.6),
        transparent
      );
    }

    .overlay-panel {
      max-width: 900px;
    }

    .overlay h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 1;
    }

    .overlay p {
      margin: 0;
      max-width: 90vw;
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      font-weight:bold;
    }
    
    a {color: white}
    
    a:visited {color: white}
    

    
  </style>

<body>
  <main class="slideshow">

    <img

      </div>

  </main>

  <script>
    const slides = document.querySelectorAll(".slide");

    let currentSlide = 0;

    // Time each image remains on screen
    const displayTime = 5000;

    function nextSlide() {
      // Turn on the next image first.
      // The current image is still visible underneath it,
      // creating a smooth crossfade rather than a black gap.
      const nextSlide = (currentSlide + 1) % slides.length;

      slides[nextSlide].classList.add("active");

      // Remove the old image after the transition has started
      setTimeout(() => {
        slides[currentSlide].classList.remove("active");
        currentSlide = nextSlide;
      }, 2000);
    }

    setInterval(nextSlide, displayTime);
  </script>
</body>
